# Configuration Nginx pour hebertik.fr et mail.hebertik.fr
# Placer ce fichier dans : /etc/nginx/sites-available/hebertik
# Puis activer : sudo ln -s /etc/nginx/sites-available/hebertik /etc/nginx/sites-enabled/
# Et tester : sudo nginx -t && sudo systemctl reload nginx

# 1. Redirection HTTP vers HTTPS (configuré automatiquement après Certbot)
server {
    listen 80;
    listen [::]:80;
    server_name hebertik.fr www.hebertik.fr mail.hebertik.fr;

    # Nginx transmet à Next.js qui gère le routing via middleware
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Support des webhooks avec payload plus lourd (ex: emails HTML complets)
        client_max_body_size 25M;
    }
}

